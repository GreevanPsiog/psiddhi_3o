name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Run the real pipeline so unit/integration tests have real data
      # to check against. Steps that need external credentials are allowed
      # to fail without failing the whole job — the tests that depend on
      # their output will just skip gracefully (see conftest.py fixtures),
      # rather than the CI run going red for a missing secret.

      - name: Run Great Expectations validation
        run: python ge_suite/run_validation.py

      - name: Run DuckDB analytics
        run: python analytics/duckdb_analytics.py

      - name: Run ML training (needs Databricks secrets)
        continue-on-error: true
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mkdir -p ml
          echo "DATABRICKS_HOST=${DATABRICKS_HOST}" > ml/.env
          echo "DATABRICKS_TOKEN=${DATABRICKS_TOKEN}" >> ml/.env
          python ml/train_models.py

      - name: Run narrative generation (dry-run — no LLM call, no secrets needed)
        run: python -m narrative.generate_narrative --dry-run

      # --- Test suite ---

      - name: Run unit + component tests
        run: pytest tests/ -v --ignore=tests/test_dag_integrity.py

      - name: Install Airflow for DAG integrity tests
        run: pip install apache-airflow==3.3.0

      - name: Run DAG integrity tests
        run: pytest tests/test_dag_integrity.py -v
